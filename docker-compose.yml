services:
  app:
    container_name: schism
    image: ghcr.io/navarroerk/schism:latest
    ports:
      - "8212:8212"
    volumes:
      - ./data/jobs:/app/jobs
      - ./data/logs:/app/logs
      - ./data/models:/app/models
    environment:
      - TZ=UTC
      - YTDLP_AUTO_UPDATE=true
      - PUID=1000
      - PGID=1000
    restart: unless-stopped
