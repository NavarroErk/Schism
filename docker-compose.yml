services:
  app:
    image: ghcr.io/navarroerk/schism:latest
    ports:
      - "8212:8212"
    volumes:
      - ./data/jobs:/app/jobs
      - ./data/logs:/app/logs
    environment:
      # timezone for job dates in the queue, e.g. America/New_York, America/Los_Angeles, Europe/London
      # full list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones (TZ identifier column)
      - TZ=UTC
    restart: unless-stopped
